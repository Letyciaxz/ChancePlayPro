<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dado | ChancePlay</title>

  <link rel="stylesheet" href="css/dado.css">
    <link rel="stylesheet" href="css/mobile.css">

  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">

  <div class="logo">
    <span>Chance</span> Play
  </div>

  <div class="nav-buttons">
    <button onclick="window.location.href='menu.html'">
      JOGOS
    </button>

    <button onclick="window.location.href='historico.html'">
      HISTÓRICO
    </button>
  </div>

</header>

<main class="container">

  <button class="back-btn" onclick="window.location.href='menu.html'">
    ← VOLTAR
  </button>

  <section class="game-title">

    <div class="icon-box">
      🎲
    </div>

    <div>
      <h1>Dado</h1>
      <p>Resultados em dados de 6 faces</p>
    </div>

  </section>

  <section class="panel">

    <h2>CONFIGURAÇÃO</h2>

    <label>QUANTIDADE DE DADOS</label>

    <select id="quantidadeDados">
      <option value="1">1 dado</option>
      <option value="2">2 dados</option>
      <option value="3">3 dados</option>
    </select>

    <label>FACE DESEJADA</label>

    <div class="dice-grid">

      <button class="dice-card active">⚀</button>
      <button class="dice-card">⚁</button>
      <button class="dice-card">⚂</button>
      <button class="dice-card">⚃</button>
      <button class="dice-card">⚄</button>
      <button class="dice-card">⚅</button>

    </div>

    <button
      class="calc-btn"
      onclick="salvarDado()"
    >
      CALCULAR
    </button>

  </section>

</main>

<script src="js/jogos.js"></script>

</body>
</html>
