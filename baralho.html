<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baralho | ChancePlay</title>

  <link rel="stylesheet" href="css/baralho.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="header">
    <div class="logo">
      <span>Chance</span> Play
    </div>

    <div class="nav-buttons">
      <button onclick="window.location.href='menu.html'">JOGOS</button>
      <button onclick="window.location.href='historico.html'">HISTÓRICO</button>
    </div>
  </header>

  <main class="container">

    <button class="back-btn" onclick="window.location.href='menu.html'">
      ← VOLTAR
    </button>

    <section class="game-title">
      <div class="icon-box">🃏</div>

      <div>
        <h1>Baralho</h1>
        <p>52 cartas — probabilidades combinadas</p>
      </div>
    </section>

    <section class="panel">

      <h2>CONFIGURAÇÃO</h2>

      <label>CARTAS A TIRAR</label>
      <input type="number" value="1" min="1">

      <label>CARTAS NO BARALHO</label>
      <input type="number" value="52" min="1">

      <label>CARTAS FAVORÁVEIS NO BARALHO</label>
      <input type="number" value="4" min="1">

      <label>TIPO DE CÁLCULO</label>
      <select>
        <option>Pelo menos 1 acerto</option>
        <option>Exatamente 1 acerto</option>
      </select>

      <button class="calc-btn" onclick="salvarBaralho()">
        CALCULAR
      </button>

    </section>

  </main>

  <script src="js/jogos.js"></script>

</body>
</html>
